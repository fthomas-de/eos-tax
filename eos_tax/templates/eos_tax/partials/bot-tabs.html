{% load i18n %}

<ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" type="button" role="tab"
                data-bs-toggle="tab" data-bs-target="#eos-tax-tab-hours"
                aria-controls="eos-tax-tab-hours" aria-selected="true">
            {% translate "Hours per day" %}
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" type="button" role="tab"
                data-bs-toggle="tab" data-bs-target="#eos-tax-tab-runs"
                aria-controls="eos-tax-tab-runs" aria-selected="false">
            {% translate "Unbroken runs" %}
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" type="button" role="tab"
                data-bs-toggle="tab" data-bs-target="#eos-tax-tab-rhythm"
                aria-controls="eos-tax-tab-rhythm" aria-selected="false">
            {% translate "Against the Corporation" %}
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" type="button" role="tab"
                data-bs-toggle="tab" data-bs-target="#eos-tax-tab-clock"
                aria-controls="eos-tax-tab-clock" aria-selected="false">
            {% translate "Off the Corporation clock" %}
        </button>
    </li>
    {# the list page only: it sums up the four lists, which a single Character has none of #}
    {% if audit_tab %}
        <li class="nav-item" role="presentation">
            <button class="nav-link" type="button" role="tab"
                    data-bs-toggle="tab" data-bs-target="#eos-tax-tab-audit"
                    aria-controls="eos-tax-tab-audit" aria-selected="false">
                {% translate "Without current audit" %}
            </button>
        </li>
    {% endif %}
</ul>
