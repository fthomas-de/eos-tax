[flake8]
exclude = .git, *migrations*, .tox, dist, htmlcov
# the same limit pylint uses in pyproject.toml
max-line-length = 120
select = C,E,F,W,B,B950
ignore = E203, E231, E501, W503, W291, W293

[tox]
envlist = py312

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
# the package itself pulls in allianceauth and corptools, and with them
# Django; testauth talks to MySQL, so the driver has to come along
deps =
    coverage
    mysqlclient
commands =
    coverage run runtests.py eos_tax -v 2
    coverage xml
    coverage report
